<title>Estudio de Guiones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Un chat: escribes lo que quieres, Claude devuelve una tanda de guiones como tarjetas.
   La miniatura oscura con el gancho en subtítulo coral es la pieza fuerte; lo demás, tranquilo. */
:root{
  --paper:#f4f5fa; --surface:#ffffff; --ink:#1d1b3a; --muted:#5f5e79; --line:#dcdde9;
  --cobalt:#3043e6; --on-cobalt:#ffffff; --coral:#ff6a3d; --thumb:#1b1a40; --bubble:#e6e9ff; --bad:#b4232f;
  --f-display:"Unbounded","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; --bubble:#262a5c; --bad:#ff7d88; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; --bubble:#262a5c; --bad:#ff7d88; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);padding-block:28px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font:700 clamp(26px,4.6vw,40px)/1.05 var(--f-display);letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.lede{color:var(--muted);font-size:16px;margin-top:8px;max-width:58ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}

/* hilo */
.thread{display:grid;gap:26px;padding-bottom:24px}
.me{justify-self:end;max-width:min(640px,92%);background:var(--bubble);border-radius:18px 18px 4px 18px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.ai{display:grid;gap:14px;min-width:0}
.ai .intro{color:var(--muted);max-width:70ch}
.thinking{color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.err{color:var(--bad);font-weight:600}
.pending{color:var(--muted);font-size:14px}
.pending ul{margin:6px 0 0;padding-left:20px}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{background:radial-gradient(110% 80% at 15% 0%,#3a3f9e 0%,transparent 60%),radial-gradient(90% 70% at 100% 100%,#7a2f5a 0%,transparent 65%),var(--thumb);
  color:#fff;padding:18px 18px 16px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.thumb .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.85}
.hook{font:700 18px/1.5 var(--f-display)}
.hook span{background:var(--coral);color:#1b0b05;padding:2px 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.body{padding:16px 18px;display:grid;gap:8px;flex:1;align-content:start}
.body h3{font:700 18px/1.3 var(--f-body)}
.meta{color:var(--muted);font-size:14px}
.why{font-size:15px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--cobalt);font-size:15px}
.beats{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.beats li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;font-size:15px}
.beats time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.beats .cta time{color:var(--coral);font-weight:600}
.extra{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.alts{margin-top:10px;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;padding:0 18px 18px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:999px;padding:11px 16px;font:700 15px var(--f-body);background:var(--cobalt);color:var(--on-cobalt);white-space:nowrap}
.btn.quiet{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600}

/* compositor */
.composer{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--paper) 22px);padding-top:22px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;display:grid;gap:8px;box-shadow:0 12px 30px -18px rgba(20,18,60,.45)}
.box textarea{border:0;background:none;resize:none;font:17px/1.5 var(--f-body);color:var(--ink);padding:8px 10px;min-height:56px;max-height:220px;width:100%}
.box textarea:focus{outline:none}
.box:focus-within{border-color:var(--cobalt)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);text-align:left}
.send{border:0;border-radius:999px;padding:11px 22px;font:700 15px var(--f-body);background:var(--cobalt);color:var(--on-cobalt);margin-left:auto}
.send[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted);padding:4px 10px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Estudio de Guiones</h1>
      <p class="lede">Todo apunta a que más gente estudie Contaduría Pública en Uniremington. Escribe un tema, una idea o un público. Te devuelvo varias opciones distintas; elige la que te guste y pide más como esa.</p>
    </div>
    <button class="ghost" type="button" id="reset">Nueva conversación</button>
  </header>
  <main class="thread" id="thread" aria-live="polite"></main>
  <form class="composer" id="composer">
    <div class="box">
      <label for="msg" class="note" style="padding-bottom:0">¿Qué guiones quieres?</label>
      <textarea id="msg" rows="2" placeholder="Dame 6 guiones para que más gente quiera estudiar Contaduría en Uniremington"></textarea>
      <div class="row">
        <div class="chips" id="chips"></div>
        <button class="send" type="submit" id="send">Generar</button>
      </div>
      <p class="note" id="status">Usa tu cuenta de Claude; la primera vez te pide permiso.</p>
    </div>
  </form>
</div>

<script>
const SEED=/*DATA*/null;
const RULES=`Eres el guionista de video corto (Reels, TikTok, Shorts) de un asesor comercial de universidades en Colombia. Escribes guiones de nivel profesional, nunca genéricos. Respondes en español de Colombia, cercano y natural.

NICHO (fijo)
El nicho es educación: el objetivo de todo guion es que más personas quieran estudiar Contaduría Pública en Uniremington. Si el usuario no dice otra cosa, cada guion es para Uniremington y Contaduría Pública, aunque el pedido sea un tema suelto. Los guiones de embudo pueden abrir con un tema amplio, pero siempre aterrizan en la decisión de estudiar (la carrera, el título, la tarjeta profesional, cómo se estudia en Uniremington) y cierran con un pedido ligado a estudiar. Un guion que entretiene pero no acerca a estudiar Contaduría no sirve. Solo cambia de programa o universidad si el usuario lo pide explícitamente.

QUÉ ENTREGAS
Por defecto 6 opciones MUY distintas entre sí (si el usuario pide otro número, ese número, máximo 10). Cada opción usa una fórmula de gancho diferente y una estructura diferente. Si el usuario dice que le gusta una opción, conserva su ADN (fórmula de gancho, estructura, ritmo, duración, tipo de cierre) y cambia el contenido hacia lo que pida (otro programa, otra universidad, otro tema, otro ángulo).
No todo guion es sobre un programa: si el usuario da un tema o idea libre, trabaja sobre eso.

MÉTODO (obligatorio)
1. Al menos la mitad de la tanda va en EMBUDO: abre con un tema que le importa a mucha gente (dinero, impuestos, la DIAN, Nequi, la IA y el empleo, el trabajo, la familia, una escena cotidiana colombiana) y gira al programa entre el 20 % y el 35 % del guion. El resto: historia vivida, prueba en pantalla, respuesta a una objeción u oferta. Roles: ~60 % Atraer, ~25 % Confianza, ~15 % Vender.
2. Gancho: lo primero que se dice, 12 palabras o menos, con un dato concreto (número, marca, escena) y algo visible en el segundo 0. Nunca saludo, nunca "en este video", nunca "¿sabías que…?" con algo obvio, nunca pregunta de sí/no obvia.
3. Fórmulas de gancho (usa una distinta por opción y nómbrala): Todavía atascado ("Haces X y aún Y"), El costo oculto ("[hábito normal] te está costando [pérdida concreta]"), Sus propias palabras (una frase real que dice el público + respuesta corta que la voltea), La voltereta ("[consejo común] es justo por qué [problema]"), Para y empieza, Lo que nadie dice, Número + resultado, Tiempo exprés, La lista corta (2 o 3), El error, Al revés, En plena escena (empieza en mitad del momento, sin contexto), Antes y después, La confesión, Cómo, sin [el dolor], El atajo, No fue eso ("[resultado], y no fue por [causa obvia]"), A vs B, La pregunta que le hacen, El recibo (mostrar prueba en pantalla), Detrás del resultado, Responder una idea popular.
4. Cuerpo: una idea por video. Una frase por línea (4 a 15 palabras). Concreto antes que abstracto; nunca tres frases abstractas seguidas. Habla a una persona ("tú"). Un reenganche entre el 40 % y el 60 % (un giro, un número, "esta es la parte que nadie hace"). Una sola promesa del gancho al cierre.
5. Cierre: un solo pedido, en una línea, que ofrezca algo concreto (comentar una palabra para recibir el plan de estudios, guardar, compartir con alguien específico, seguir). Nunca "gracias por ver" ni resumen.
6. Duración: 2,7 palabras por segundo. La mayoría entre 25 y 40 s (70 a 110 palabras). Respeta la duración que pida el usuario.
7. Prohibido sonar a IA: nada de "no es X, es Y", tríadas de adjetivos, frases sueltas tipo "Sin rodeos. Sin excusas.", preguntas que se responden solas ("¿El resultado?"), "descubre", "potencia", "transforma tu vida", "en el mundo actual", "sin duda", "clave del éxito", "no te lo pierdas".
8. Verdad y cumplimiento: nunca prometas empleo, salario, ascenso, "garantizado", "100 %", "la mejor universidad", ni urgencia falsa ("últimos cupos" sin fecha real). No nombres ni ataques a otras universidades. No inventes cifras, acreditaciones, precios, fechas, testimonios ni nombres: lo que no esté en los datos de abajo o en lo que diga el usuario va como [CONFIRMAR: qué]. Los datos de normas o impuestos solo si son ciertos; lo que cambie cada año, [CONFIRMAR].

DATOS CONOCIDOS
- Uniremington (Corporación Universitaria Remington), Colombia. Contaduría Pública: presencial (SNIES 13259), distancia (SNIES 117355), virtual (SNIES 104911) [confirmar vigencia]; virtual 9 semestres [CONFIRMAR]; Facultad de Ciencias Contables; acreditación en alta calidad de la facultad [CONFIRMAR alcance]; consultorio contable virtual [CONFIRMAR uso por estudiantes virtuales]. Palabra de cierre sugerida para Contaduría: CONTADOR. De otros programas de Uniremington no hay datos confirmados: usa [CONFIRMAR] para duración, modalidad, SNIES y diferenciales.
- Colombia (impuestos, ciertos): declara renta la persona natural con ingresos brutos, consignaciones o compras con tarjeta de 1.400 UVT o más en el año; la sanción mínima es de 10 UVT; los vencimientos de renta de personas naturales van de agosto a octubre según los dos últimos dígitos del NIT/cédula; bancos y billeteras reportan información exógena a la DIAN; los estados financieros y las declaraciones de contribuyentes grandes deben ir firmados por contador público con tarjeta profesional. El valor en pesos de la UVT de cada año: [CONFIRMAR].

FORMATO DE RESPUESTA (estricto, se lee por máquina)
Una línea JSON por objeto, sin texto adicional, sin bloques de código, sin saltos de línea dentro de un objeto:
{"t":"intro","texto":"una o dos frases sobre el enfoque de esta tanda"}
{"t":"opcion","titulo":"nombre corto de la fórmula ganadora","formula":"nombre de la fórmula de gancho","estructura":"embudo | historia vivida | prueba en pantalla | respuesta a objeción | opinión que divide | lista | oferta","rol":"Atraer | Confianza | Vender","duracion":35,"beats":[{"ini":"0:00","fin":"0:03","voz":"lo que se dice","pantalla":"texto en pantalla, 6 palabras o menos","visual":"qué se ve","cta":false}],"por_que":"por qué puede funcionar, 1 o 2 frases","alternativos":["gancho alternativo con otra fórmula","otro"]}
(una línea "opcion" por cada guion; el último beat de cada guion lleva "cta":true)
{"t":"fin","confirmar":["dato a confirmar 1","dato 2"]}`;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):"";
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// estado: mensajes [{role:"user",text} | {role:"assistant",intro,options,pending,error}]
let msgs=[], busy=false, ctl=null, sample=undefined;
const STORE="estudio-guiones-v1";

function seedThread(){
  if(!SEED||!SEED.length)return [];
  const t=SEED[0];
  return [{role:"user",text:"Creemos guiones de "+t.title.replace(" · "," para ")},
          {role:"assistant",intro:"Esta es la tanda que ya hicimos. Dime cuál te gusta o pide algo nuevo abajo.",options:t.options,pending:t.pending||[]}];
}
function load(){try{const s=JSON.parse(sget(STORE)||"null");if(Array.isArray(s)&&s.length)return s}catch(e){}return seedThread()}
function save(){sset(STORE,JSON.stringify(msgs.filter(m=>!m.streaming).slice(-20)))}

// normaliza una opción generada al formato de tarjeta
function fromGen(o,n){
  const beats=(o.beats||[]).map(b=>({t:`${b.ini||""}–${b.fin||""}`,voz:String(b.voz||""),cta:!!b.cta,
    extra:[b.pantalla&&("En pantalla: "+b.pantalla),b.visual&&("Imagen: "+b.visual)].filter(Boolean).join(" · ")}));
  return {n,name:o.titulo||("Opción "+n),dur:(o.duracion?o.duracion+" s":""),hook:beats[0]?.voz||"",beats,why:o.por_que||"",
    alts:Array.isArray(o.alternativos)?o.alternativos.join(" · "):(o.alternativos||""),gancho:o.formula||"",estructura:o.estructura||"",para:o.rol||""};
}
function compact(m){ // lo que el modelo recuerda de una respuesta anterior
  return (m.options||[]).map(o=>`Opción ${o.n} · ${o.name} (${o.gancho}; ${o.estructura}; ${o.dur}; ${o.para}). Gancho: "${o.hook}". Guion: ${o.beats.map(b=>b.voz).join(" ")}`).join("\n");
}

function card(o,mi){
  return `<article class="card">
    <div class="thumb"><div class="top"><span>Opción ${o.n}</span><span>${esc(o.dur)}</span></div><p class="hook"><span>${esc(o.hook)}</span></p></div>
    <div class="body"><h3>${esc(o.name)}</h3>
      <p class="meta">${esc([o.gancho&&o.gancho.replace(/\s*\(\d+\)/,""),o.estructura,o.para].filter(Boolean).join(" · "))}</p>
      ${o.why?`<p class="why">${esc(cap(o.why))}</p>`:""}
      <details><summary>Ver guion completo</summary>
        <ol class="beats">${o.beats.map(b=>`<li class="${b.cta?"cta":""}"><time>${esc(b.t)}</time><div>${esc(b.voz)}${b.extra?`<span class="extra">${esc(b.extra)}</span>`:""}</div></li>`).join("")}</ol>
        ${o.alts?`<p class="alts">Otros ganchos: ${esc(o.alts)}</p>`:""}
      </details></div>
    <div class="actions"><button class="btn" type="button" data-more="${mi}:${o.n}">Quiero más como este</button><button class="btn quiet" type="button" data-copy="${mi}:${o.n}">Copiar</button></div>
  </article>`;
}
function render(){
  $("thread").innerHTML=msgs.map((m,i)=>{
    if(m.role==="user")return `<div class="me">${esc(m.text)}</div>`;
    const opts=m.options||[];
    return `<section class="ai">
      ${m.intro?`<p class="intro">${esc(m.intro)}</p>`:""}
      ${opts.length?`<div class="grid">${opts.map(o=>card(o,i)).join("")}</div>`:""}
      ${m.streaming?`<p class="thinking"><span class="dot"></span>${opts.length?"Escribiendo la siguiente opción…":"Pensando la tanda… (puede tardar un minuto)"}</p>`:""}
      ${m.error?`<p class="err">${esc(m.error)}</p>`:""}
      ${m.pending&&m.pending.length?`<div class="pending">Por confirmar antes de publicar:<ul>${m.pending.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
    </section>`}).join("");
}
function scrollEnd(){window.scrollTo({top:document.body.scrollHeight,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}

const CHIPS=["Guiones para auxiliares contables que no tienen el título","5 videos sobre la DIAN que lleven a estudiar Contaduría","Guiones para bachilleres buenos con los números"];
function renderChips(){$("chips").innerHTML=CHIPS.map(c=>`<button class="chip" type="button">${esc(c)}</button>`).join("")}

const COPY={not_granted:"La página no tiene permiso para usar Claude. Puedes darlo desde el menú de permisos del artifact, o pedir los guiones en el chat de Claude Code.",
  sampling_disabled:"Claude no está disponible para esta cuenta desde esta página. Pide los guiones en el chat de Claude Code.",
  rate_limited:"Llegaste al límite de uso por ahora. Espera un rato y vuelve a intentar.",
  session_expired:"Tu sesión expiró. Vuelve a iniciar sesión en claude.ai.",
  refused:"Claude no quiso responder ese pedido. Cámbialo un poco y vuelve a intentar.",
  prompt_too_large:"La conversación es muy larga. Empieza una nueva conversación.",
  invalid_json:"No pude leer la respuesta completa. Intenta de nuevo."};

async function ask(text){
  if(busy||!text.trim())return;
  if(sample===undefined)sample=await claude.use("sample").catch(()=>null);
  if(!sample){$("status").textContent="Esta vista no puede usar Claude. Ábrela en claude.ai o pide los guiones en el chat de Claude Code.";return}
  busy=true; $("send").textContent="Detener"; $("msg").value="";
  msgs.push({role:"user",text});
  const turns=[{role:"user",content:RULES}];
  for(const m of msgs.slice(-9)){
    if(m.role==="user")turns.push({role:"user",content:m.text});
    else if(m.options&&m.options.length)turns.push({role:"assistant",content:compact(m)});
  }
  const ai={role:"assistant",intro:"",options:[],pending:[],streaming:true}; msgs.push(ai); render(); scrollEnd();
  ctl=new AbortController(); let pend="";
  const eat=line=>{line=line.trim().replace(/^```\w*|```$/g,"").trim(); if(!line)return;
    let o; try{o=JSON.parse(line)}catch(e){return}
    if(o.t==="intro")ai.intro=o.texto||"";
    else if(o.t==="opcion")ai.options.push(fromGen(o,ai.options.length+1));
    else if(o.t==="fin")ai.pending=Array.isArray(o.confirmar)?o.confirmar:[];
    render();};
  try{
    await sample(turns,{cache:false,signal:ctl.signal,onText:({delta})=>{const ls=(pend+delta).split("\n");pend=ls.pop();ls.forEach(eat)}});
    eat(pend);
    if(!ai.options.length)ai.error="No pude leer los guiones de la respuesta. Intenta de nuevo o pide menos opciones.";
  }catch(e){
    eat(pend);
    if(e&&e.code==="cancelled"){if(!ai.options.length)ai.error="Detenido."}
    else ai.error=(e&&COPY[e.code])||"Se cortó la conexión. Intenta de nuevo.";
    if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"))$("status").textContent=COPY[e.code];
  }finally{
    ai.streaming=false; busy=false; $("send").textContent="Generar"; render(); save();
  }
}

$("composer").addEventListener("submit",e=>{e.preventDefault(); if(busy){ctl&&ctl.abort();return} ask($("msg").value)});
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){$("msg").value=b.textContent;$("msg").focus()}});
$("thread").addEventListener("click",e=>{
  const more=e.target.closest("[data-more]"), cp=e.target.closest("[data-copy]");
  const pick=el=>{const [mi,n]=el.dataset[el.dataset.more!==undefined?"more":"copy"].split(":");return msgs[+mi].options.find(o=>String(o.n)===n)};
  if(more){const o=pick(more);
    $("msg").value=`Me gusta la opción ${o.n}, "${o.name}". Hazme 5 más con ese mismo ADN (gancho tipo ${o.gancho}, ${o.estructura}, ${o.dur}) para `;
    $("msg").focus(); const L=$("msg").value.length; $("msg").setSelectionRange(L,L); scrollEnd();}
  if(cp){const o=pick(cp);
    const txt=`${o.name} (${o.dur})\n\n`+o.beats.map(b=>`[${b.t}] ${b.voz}${b.extra?"\n   "+b.extra:""}`).join("\n");
    const done=m=>{cp.textContent=m;setTimeout(()=>cp.textContent="Copiar",1500)};
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>done("Copiado"),()=>done("No se pudo"));}
});
