<title>Guiones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Una sola tarea: leer las opciones de una tanda y elegir la favorita.
   La miniatura oscura con el gancho en subtítulo coral es la pieza fuerte; el resto, tranquilo. */
:root{
  --paper:#f4f5fa; --surface:#ffffff; --ink:#1d1b3a; --muted:#5f5e79; --line:#dcdde9;
  --cobalt:#3043e6; --on-cobalt:#ffffff; --coral:#ff6a3d; --thumb:#1b1a40;
  --f-display:"Unbounded","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);padding-block:32px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font:700 clamp(28px,5vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--muted);font-size:17px;margin-top:10px;max-width:56ch}
header{display:grid;gap:18px;margin-bottom:30px}
select{font:600 16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:100%}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{background:radial-gradient(110% 80% at 15% 0%,#3a3f9e 0%,transparent 60%),radial-gradient(90% 70% at 100% 100%,#7a2f5a 0%,transparent 65%),var(--thumb);
  color:#fff;padding:22px 20px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.thumb .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.85}
.hook{font:700 19px/1.5 var(--f-display)}
.hook span{background:var(--coral);color:#1b0b05;padding:2px 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.body{padding:18px 20px 20px;display:grid;gap:10px;flex:1;align-content:start}
.body h2{font:700 19px/1.3 var(--f-body)}
.meta{color:var(--muted);font-size:14px}
.why{font-size:15px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--cobalt);font-size:15px}
.beats{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.beats li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;font-size:15px}
.beats time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.beats .cta time{color:var(--coral);font-weight:600}
.beats .extra{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.alts{margin-top:12px;font-size:14px;color:var(--muted)}
.pick{margin-top:auto;padding:0 20px 20px}
.btn{width:100%;border:0;border-radius:999px;padding:12px 18px;font:700 15px var(--f-body);background:var(--cobalt);color:var(--on-cobalt);cursor:pointer}
.btn.done{background:var(--ink);color:var(--paper)}
.pending{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:10px;max-width:70ch}
.pending h2{font:700 18px/1.3 var(--f-body)}
.pending ul{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="title">Guiones</h1>
      <p class="lede">Lee las opciones y quédate con la que más te guste. El botón copia el pedido; pégalo en el chat y te hago más con esa misma fórmula.</p>
    </div>
    <label id="pickerWrap" hidden>
      <span class="meta" style="display:block;margin-bottom:6px">Tanda</span>
      <select id="picker"></select>
    </label>
  </header>
  <div class="grid" id="grid"></div>
  <section class="pending" id="pending" hidden>
    <h2>Por confirmar antes de publicar</h2>
    <ul id="pendingList"></ul>
  </section>
</div>

<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function show(i){
  const t=DATA[i]; if(!t)return;
  $("title").textContent=t.title;
  $("grid").innerHTML=t.options.map(o=>`
    <article class="card">
      <div class="thumb"><div class="top"><span>Opción ${o.n}</span><span>${esc(o.dur)}</span></div>
        <p class="hook"><span>${esc(o.hook)}</span></p></div>
      <div class="body">
        <h2>${esc(o.name)}</h2>
        <p class="meta">${esc([o.gancho&&o.gancho.replace(/\s*\(\d+\)/,""),o.estructura,o.para].filter(Boolean).join(" · "))}</p>
        ${o.why?`<p class="why">${esc(o.why.charAt(0).toUpperCase()+o.why.slice(1))}</p>`:""}
        <details><summary>Ver guion completo</summary>
          <ol class="beats">${o.beats.map(b=>`<li class="${b.cta?"cta":""}"><time>${esc(b.t)}</time><div>${esc(b.voz)}${b.extra?`<span class="extra">${esc(b.extra)}</span>`:""}</div></li>`).join("")}</ol>
          ${o.alts?`<p class="alts">Otros ganchos: ${esc(o.alts)}</p>`:""}
        </details>
      </div>
      <div class="pick"><button class="btn" type="button" data-n="${o.n}">Quiero más como este</button></div>
    </article>`).join("");
  $("pending").hidden=!t.pending.length;
  $("pendingList").innerHTML=t.pending.map(p=>`<li>${esc(p)}</li>`).join("");
  sset("guiones-tanda",String(i));
}
function init(){
  if(!DATA||!DATA.length){$("grid").innerHTML='<p class="empty">Todavía no hay tandas. Pide guiones en el chat y aparecerán aquí.</p>';return}
  if(DATA.length>1){$("pickerWrap").hidden=false;$("picker").innerHTML=DATA.map((t,i)=>`<option value="${i}">${esc(t.title)}</option>`).join("")}
  let i=+(sget("guiones-tanda")||0); if(!(i<DATA.length))i=0; $("picker").value=i; show(i);
  $("picker").addEventListener("change",e=>show(+e.target.value));
  $("grid").addEventListener("click",e=>{
    const b=e.target.closest("[data-n]"); if(!b)return;
    const t=DATA[+$("picker").value||0], o=t.options.find(x=>String(x.n)===b.dataset.n);
    const txt=`Me gusta la opción ${o.n} (${o.name}) de "${t.title}". Hazme más como esa.`;
    const ok=()=>{b.textContent="Copiado. Pégalo en el chat";b.classList.add("done");setTimeout(()=>{b.textContent="Quiero más como este";b.classList.remove("done")},2400)};
    const fail=()=>{b.textContent=`Escribe en el chat: "me gusta la ${o.n}"`;b.classList.add("done")};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fail);else fail();
  });
}
init();
</script>
