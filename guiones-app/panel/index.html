<style>
/* Un chat: escribes lo que quieres, Claude devuelve una tanda de guiones como tarjetas.
   La miniatura oscura con el gancho en subtítulo coral es la pieza fuerte; lo demás, tranquilo. */
:root{
  --paper:#f4f5fa; --surface:#ffffff; --ink:#1d1b3a; --muted:#5f5e79; --line:#dcdde9;
  --cobalt:#3043e6; --on-cobalt:#ffffff; --coral:#ff6a3d; --thumb:#1b1a40; --bubble:#e6e9ff; --bad:#b4232f;
  --f-display:"Unbounded","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; --bubble:#262a5c; --bad:#ff7d88; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; --bubble:#262a5c; --bad:#ff7d88; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);padding-block:28px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font:700 clamp(26px,4.6vw,40px)/1.05 var(--f-display);letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.lede{color:var(--muted);font-size:16px;margin-top:8px;max-width:58ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}

/* hilo */
.thread{display:grid;gap:26px;padding-bottom:24px}
.me{justify-self:end;max-width:min(640px,92%);background:var(--bubble);border-radius:18px 18px 4px 18px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.ai{display:grid;gap:14px;min-width:0}
.ai .intro{color:var(--muted);max-width:70ch}
.thinking{color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.err{color:var(--bad);font-weight:600}
.pending{color:var(--muted);font-size:14px}
.pending ul{margin:6px 0 0;padding-left:20px}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{background:radial-gradient(110% 80% at 15% 0%,#3a3f9e 0%,transparent 60%),radial-gradient(90% 70% at 100% 100%,#7a2f5a 0%,transparent 65%),var(--thumb);
  color:#fff;padding:18px 18px 16px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.thumb .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.85}
.hook{font:700 18px/1.5 var(--f-display)}
.hook span{background:var(--coral);color:#1b0b05;padding:2px 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.body{padding:16px 18px;display:grid;gap:8px;flex:1;align-content:start}
.body h3{font:700 18px/1.3 var(--f-body)}
.meta{color:var(--muted);font-size:14px}
.why{font-size:15px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--cobalt);font-size:15px}
.beats{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.beats li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;font-size:15px}
.beats time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.beats .cta time{color:var(--coral);font-weight:600}
.extra{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.alts{margin-top:10px;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;padding:0 18px 18px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:999px;padding:11px 16px;font:700 15px var(--f-body);background:var(--cobalt);color:var(--on-cobalt);white-space:nowrap}
.btn.quiet{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600}

/* compositor */
.composer{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--paper) 22px);padding-top:22px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;display:grid;gap:8px;box-shadow:0 12px 30px -18px rgba(20,18,60,.45)}
.box textarea{border:0;background:none;resize:none;font:17px/1.5 var(--f-body);color:var(--ink);padding:8px 10px;min-height:56px;max-height:220px;width:100%}
.box textarea:focus{outline:none}
.box:focus-within{border-color:var(--cobalt)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);text-align:left}
.send{border:0;border-radius:999px;padding:11px 22px;font:700 15px var(--f-body);background:var(--cobalt);color:var(--on-cobalt);margin-left:auto}
.send[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted);padding:4px 10px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Estudio de Guiones</h1>
      <p class="lede">Todo apunta a que más gente estudie Contaduría Pública en Uniremington. Escribe un tema, una idea o un público. Te devuelvo varias opciones distintas; elige la que te guste y pide más como esa.</p>
    </div>
    <button class="ghost" type="button" id="reset">Nueva conversación</button>
  </header>
  <main class="thread" id="thread" aria-live="polite"></main>
  <form class="composer" id="composer">
    <div class="box">
      <label for="msg" class="note" style="padding-bottom:0">¿Qué guiones quieres?</label>
      <textarea id="msg" rows="2" placeholder="Dame 6 guiones para que más gente quiera estudiar Contaduría en Uniremington"></textarea>
      <div class="row">
        <div class="chips" id="chips"></div>
        <button class="send" type="submit" id="send">Generar</button>
      </div>
      <p class="note" id="status">Usa tu cuenta de Claude; la primera vez te pide permiso.</p>
    </div>
  </form>
</div>

:false,"extra":"En pantalla: \"Estado financiero\" · Imagen: señala las líneas de la hoja"},{"t":"0:08–0:14","voz":"Con ella sabes si al negocio le alcanza para pagar, crecer o contratar.","cta":false,"extra":"En pantalla: \"Pagar, crecer, contratar\" · Imagen: estudiantes leyendo copias de la hoja"},{"t":"0:14–0:17","voz":"Y no lo haces a mano.","cta":false,"extra":"En pantalla: \"No a mano\" · Imagen: corte a la sala de sistemas"},{"t":"0:17–0:22","voz":"Lo haces en los programas contables que usan las empresas [CONFIRMAR cuáles se enseñan].","cta":false,"extra":"En pantalla: \"Programas contables\" · Imagen: estudiantes trabajando en un software contable"},{"t":"0:22–0:25","voz":"Escríbenos hoy al WhatsApp y matricúlate en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Escríbenos: [CONFIRMAR WhatsApp] · *Matricúlate*\" · Imagen: a cámara, con el número de WhatsApp en pantalla"}],"why":"mostrar el objeto real en la mano detiene el dedo, y explica en una frase lo que hace un contador. La parte del software le quita la imagen de \"carrera de papel y lápiz\".","alts":"(Cifra, viral-hooks #081) \"Una hoja: eso es lo que mira un banco antes de prestarle a una empresa.\" 8/10 · (Detrás del resultado) \"Así se ve por dentro lo que estudia un contador.\" 8/10","gancho":"El recibo","estructura":"Prueba en mano","para":"Confianza"},{"n":8,"name":"Por qué la U: por qué la escogí","dur":"25 s","hook":"¿Por qué escogí Uniremington? Te lo digo rápido.","beats":[{"t":"0:00–0:03","voz":"¿Por qué escogí Uniremington? Te lo digo rápido.","cta":false,"extra":"En pantalla: \"¿Por qué *Uniremington*?\" · Imagen: segundo 0: el estudiante a cámara en la entrada de la sede"},{"t":"0:03–0:09","voz":"Primero, porque queda aquí en Armenia. No me tocó irme a otra ciudad.","cta":false,"extra":"En pantalla: \"1. Aquí en Armenia\" · Imagen: señala la fachada de la sede"},{"t":"0:09–0:14","voz":"Segundo, porque podía seguir trabajando mientras estudio [CONFIRMAR modalidad y horario].","cta":false,"extra":"En pantalla: \"2. Sigo trabajando\" · Imagen: entra con el bolso del trabajo"},{"t":"0:14–0:21","voz":"Y tercero, porque el programa tiene registro calificado del Ministerio de Educación. Yo lo revisé.","cta":false,"extra":"En pantalla: \"3. Registro calificado\" · Imagen: muestra en el celular la consulta del SNIES"},{"t":"0:21–0:25","voz":"Si buscas dónde estudiar Contaduría, escríbenos hoy y matricúlate aquí, en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Escríbenos: [CONFIRMAR WhatsApp] · *Matricúlate*\" · Imagen: a cámara, con el número de WhatsApp en pantalla"}],"why":"las razones las dice un estudiante, no la universidad, y por eso se creen más. Cada razón quita una duda real: distancia, tiempo y confianza.","alts":"(Lista corta) \"Tres razones por las que escogí Uniremington Armenia.\" 9/10 · (Pregunta) \"¿Dónde estudiar Contaduría en Armenia? Te cuento dónde estudio yo.\" 8/10","gancho":"Detrás del resultado","estructura":"Testimonio","para":"Vender"},{"n":9,"name":"Por qué la U: revisa que esté aprobada","dur":"25 s","hook":"Cómo saber si una carrera está aprobada sin preguntarle a nadie.","beats":[{"t":"0:00–0:03","voz":"Cómo saber si una carrera está aprobada sin preguntarle a nadie.","cta":false,"extra":"En pantalla: \"¿Está *aprobada*?\" · Imagen: segundo 0: el profesor abre la página del SNIES en el computador"},{"t":"0:03–0:09","voz":"Entra a la página del SNIES del Ministerio de Educación y busca el programa.","cta":false,"extra":"En pantalla: \"Busca en el SNIES\" · Imagen: escribe \"Contaduría Pública\" en el buscador"},{"t":"0:09–0:13","voz":"Si aparece con registro calificado, está aprobado.","cta":false,"extra":"En pantalla: \"Registro calificado = aprobado\" · Imagen: aparece el resultado"},{"t":"0:13–0:16","voz":"Si no aparece, pregunta antes de pagar.","cta":false,"extra":"En pantalla: \"Pregunta antes de pagar\" · Imagen: a cámara"},{"t":"0:16–0:21","voz":"La Contaduría Pública de Uniremington aparece ahí. Búscala tú mismo [CONFIRMAR código para Armenia].","cta":false,"extra":"En pantalla: \"Búscala tú\" · Imagen: señala el programa de Uniremington en la pantalla"},{"t":"0:21–0:25","voz":"Escríbenos hoy al WhatsApp. Te mandamos el enlace y te ayudamos a matricularte.","cta":true,"extra":"En pantalla: \"Escríbenos: [CONFIRMAR WhatsApp] · *Matricúlate*\" · Imagen: a cámara, con el número de WhatsApp en pantalla"}],"why":"enseña algo útil para cualquier aspirante, sin vender, y deja a Uniremington bien parada porque invita a comprobarlo. La confianza se gana mostrando, no diciendo.","alts":"(El error) \"El error que más plata cuesta al escoger universidad.\" 8/10 · (Para y empieza) \"No pagues una matrícula sin revisar esto primero.\" 9/10","gancho":"Cómo, sin","estructura":"Enseñanza","para":"Confianza"},{"n":10,"name":"Por qué la U: practicar antes de graduarte","dur":"20 s","hook":"No esperes a graduarte para practicar contabilidad.","beats":[{"t":"0:00–0:03","voz":"No esperes a graduarte para practicar contabilidad.","cta":false,"extra":"En pantalla: \"Practica *desde ya*\" · Imagen: segundo 0: el estudiante atiende a una persona con una carpeta de facturas"},{"t":"0:03–0:09","voz":"Aquí practicamos con casos de negocios reales en el consultorio contable [CONFIRMAR].","cta":false,"extra":"En pantalla: \"Consultorio contable\" · Imagen: estudiantes revisando un caso en grupo"},{"t":"0:09–0:12","voz":"Y te corrige un profesor.","cta":false,"extra":"En pantalla: \"Con un profesor\" · Imagen: el profesor revisa y señala algo en el papel"},{"t":"0:12–0:17","voz":"Así practicas lo mismo que vas a hacer cuando te gradúes.","cta":false,"extra":"En pantalla: \"Lo mismo, desde ya\" · Imagen: a cámara"},{"t":"0:17–0:20","voz":"Si quieres aprender así, escríbenos ya y matricúlate en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Escríbenos: [CONFIRMAR WhatsApp] · *Matricúlate*\" · Imagen: a cámara, con el número de WhatsApp en pantalla"}],"why":"practicar con casos reales es una razón concreta para escoger una universidad, y verlo en cámara lo prueba. Quita el miedo de \"salir sin experiencia\".","alts":"(Detrás del resultado) \"Así atiende un estudiante de Contaduría su primer caso real.\" 9/10 · (Cómo, sin) \"Cómo ganar experiencia en contabilidad sin haberte graduado.\" 8/10","gancho":"Para y empieza","estructura":"Prueba","para":"Vender"}],"pending":["Número de WhatsApp oficial de Uniremington Armenia para el cierre de todos los guiones.","Autorización de uso de imagen de cada estudiante y profesor.","Opciones 2, 6 y 8: estudiantes reales y que lo que dicen sea su experiencia (en la 8, sus tres razones).","Modalidades y horarios en la sede Armenia (opción 8).","Código SNIES que aplica a la sede Armenia (opciones 8 y 9).","Qué programas contables se enseñan (opción 7).","Si el consultorio contable funciona en la sede Armenia y con casos reales (opción 10)."]},{"file":"2026-11-14_uniremington_contaduria_armenia_10lineas.md","title":"Uniremington Armenia · Contaduría Pública, 10 líneas","options":[{"n":1,"name":"Plata personal: la prima","dur":"30 s","hook":"Si haces esto, la prima de diciembre te dura una semana.","beats":[{"t":"0:00–0:03","voz":"Si haces esto, la prima de diciembre te dura una semana.","cta":false,"extra":"En pantalla: \"Prima: *7 días*\" · Imagen: segundo 0: el profesor suelta un fajo de billetes de juego sobre el escritorio"},{"t":"0:03–0:09","voz":"Te llega antes del 20 de diciembre y la gastas sin anotar nada. Regalos, ropa, la novena.","cta":false,"extra":"En pantalla: \"Regalos, ropa, novena\" · Imagen: un estudiante va tomando billetes del fajo uno por uno"},{"t":"0:09–0:13","voz":"Un contador haría una cosa antes de gastar un peso.","cta":false,"extra":"En pantalla: \"Antes de gastar\" · Imagen: el profesor detiene la mano del estudiante, mira a cámara"},{"t":"0:13–0:22","voz":"Divide la prima en tres: lo que debes, lo que ahorras y lo que gastas. Y lo anota.","cta":false,"extra":"En pantalla: \"Debo · ahorro · gasto\" · Imagen: reparte los billetes en tres sobres y escribe las tres palabras en el tablero"},{"t":"0:22–0:25","voz":"Así en enero no te toca pedir prestado.","cta":false,"extra":"En pantalla: \"Enero tranquilo\" · Imagen: los estudiantes asienten y anotan"},{"t":"0:25–0:30","voz":"Si te gusta organizar la plata, comenta CONTADOR y te contamos cómo estudiar Contaduría en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: el profesor a cámara, el salón detrás"}],"why":"sale cuando la gente está recibiendo la prima y le sirve a cualquier empleado. Ver a un profesor enseñándolo en clase lo hace creíble y muestra cómo se aprende en la universidad.","alts":"(Cifra, viral-hooks #089) \"Tres sobres: lo único que necesitas para que la prima te dure.\" 9/10 · (El error) \"El error con la prima que te deja sin plata en enero.\" 9/10","gancho":"El costo oculto","estructura":"Embudo","para":"Atraer"},{"n":2,"name":"Negocios del Quindío: Salento","dur":"35 s","hook":"Salento se llena en diciembre. El problema llega en febrero.","beats":[{"t":"0:00–0:03","voz":"Salento se llena en diciembre. El problema llega en febrero.","cta":false,"extra":"En pantalla: \"Diciembre lleno. *¿Y febrero?*\" · Imagen: segundo 0: el video beam proyecta la calle Real de Salento llena de turistas"},{"t":"0:03–0:10","voz":"Con el hotel lleno, la plata entra fácil y se gasta igual de fácil: arreglos, personal, compras.","cta":false,"extra":"En pantalla: \"Entra fácil, sale fácil\" · Imagen: el profesor señala la foto; los estudiantes miran"},{"t":"0:10–0:14","voz":"Un contador ve venir febrero desde noviembre.","cta":false,"extra":"En pantalla: \"Febrero se ve venir\" · Imagen: cambia la foto a la misma calle vacía"},{"t":"0:14–0:18","voz":"Y lo que hace es muy sencillo.","cta":false,"extra":"En pantalla: \"Muy sencillo\" · Imagen: el profesor toma una alcancía del escritorio"},{"t":"0:18–0:29","voz":"Guarda una parte de lo que entra en temporada alta para pagar los meses en que llegan pocos turistas. Sueldos, servicios, arriendo.","cta":false,"extra":"En pantalla: \"Guardar para la temporada baja\" · Imagen: escribe en el tablero \"temporada alta → guardar\" mientras un estudiante mete billetes en la alcancía"},{"t":"0:29–0:35","voz":"Si te gustaría ayudar a los negocios del Quindío así, comenta CONTADOR y te contamos cómo estudiar en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: el profesor a cámara"}],"why":"el turismo mueve al Quindío y todo el que trabaja en él conoce la temporada baja. Las dos fotos (lleno y vacío) en el video beam cuentan la historia sin salir del aula.","alts":"(Hora exacta, viral-hooks #085) \"Febrero: el mes en que se nota quién llevó las cuentas en diciembre.\" 8/10 · (Antes y después) \"Hotel lleno en diciembre. Sin plata para el arriendo en febrero.\" 9/10","gancho":"Lo que nadie dice","estructura":"Embudo","para":"Atraer"},{"n":3,"name":"Debate: la IA y el contador","dur":"30 s","hook":"Dicen que la IA va a acabar con los contadores. Mira esto.","beats":[{"t":"0:00–0:03","voz":"Dicen que la IA va a acabar con los contadores. Mira esto.","cta":false,"extra":"En pantalla: \"¿IA *vs* contador?\" · Imagen: segundo 0: el estudiante frente a un computador donde una IA ordena facturas en segundos"},{"t":"0:03–0:09","voz":"Es cierto que la IA ya ordena facturas y hace cuentas en segundos.","cta":false,"extra":"En pantalla: \"Facturas en segundos\" · Imagen: primer plano de la pantalla"},{"t":"0:09–0:13","voz":"Pero hay algo que la ley no le deja hacer: firmar.","cta":false,"extra":"En pantalla: \"Firmar\" · Imagen: entra el profesor y pone un documento junto al teclado"},{"t":"0:13–0:22","voz":"Los estados financieros de una empresa los firma un contador público con tarjeta profesional, y responde con su nombre.","cta":false,"extra":"En pantalla: \"Tarjeta profesional\" · Imagen: el profesor firma el documento [CONFIRMAR si muestra su tarjeta y lo autoriza]"},{"t":"0:22–0:25","voz":"La IA le quita la parte aburrida.","cta":false,"extra":"En pantalla: \"La parte aburrida\" · Imagen: el estudiante sonríe a cámara"},{"t":"0:25–0:30","voz":"Si te llama esta carrera, comenta CONTADOR y te contamos cómo estudiarla en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: estudiante y profesor a cámara"}],"why":"\"la IA acaba con los trabajos\" es un debate en el que todos opinan. La escena de la máquina rápida y la firma del profesor deja clara la idea en un segundo.","alts":"(Cuánto falta, viral-hooks #058) \"¿Cuánto falta para que la IA reemplace a los contadores?\" 8/10 · (La voltereta) \"La IA va a hacer que los contadores valgan más.\" 9/10","gancho":"Responder una idea","estructura":"Opinión que divide","para":"Atraer y comentarios"},{"n":4,"name":"Para los papás","dur":"30 s","hook":"'Mi hijo es bueno para los números, ¿qué estudia?' Le respondo.","beats":[{"t":"0:00–0:03","voz":"'Mi hijo es bueno para los números, ¿qué estudia?' Le respondo.","cta":false,"extra":"En pantalla: \"Papás, *esto es para ustedes*\" · Imagen: segundo 0: el profesor lee la pregunta en su celular y mira a cámara"},{"t":"0:03–0:10","voz":"Si además es ordenado y le gusta entender cómo funciona un negocio, mírenle Contaduría Pública.","cta":false,"extra":"En pantalla: \"Ordenado + números\" · Imagen: estudiantes en clase organizando cuentas en el cuaderno"},{"t":"0:10–0:14","voz":"Hay algo que a los papás les da tranquilidad.","cta":false,"extra":"En pantalla: \"Lo que da tranquilidad\" · Imagen: el profesor a cámara en el pasillo"},{"t":"0:14–0:24","voz":"Todo negocio necesita llevar cuentas: la tienda, la finca, la empresa grande. Es una carrera que sirve en cualquier parte del país.","cta":false,"extra":"En pantalla: \"Sirve en cualquier negocio\" · Imagen: el tablero con tres columnas \"tienda · finca · empresa\" y estudiantes trabajando en cada una"},{"t":"0:24–0:30","voz":"Comenten CONTADOR y les mandamos el plan de estudios de Uniremington Armenia para revisarlo con su hijo.","cta":true,"extra":"En pantalla: \"Pidan el plan de estudios\" · Imagen: el profesor a cámara"}],"why":"en educación los papás muchas veces deciden o pagan. Ver a un profesor que les habla directo, en la sede, les da confianza.","alts":"(Pregunta, viral-hooks #057) \"¿Qué haría usted si su hijo no sabe qué estudiar?\" 8/10 · (Lo que nadie dice) \"Lo que ningún papá pregunta antes de escoger carrera.\" 7/10","gancho":"La pregunta que le hacen","estructura":"Respuesta a objeción","para":"Confianza"},{"n":5,"name":"Mamás que estudian","dur":"30 s","hook":"Seis de la tarde: salgo del trabajo y entro a clase.","beats":[{"t":"0:00–0:03","voz":"Seis de la tarde: salgo del trabajo y entro a clase.","cta":false,"extra":"En pantalla: \"Mamá, trabaja *y estudia*\" · Imagen: segundo 0: la estudiante entra al salón con el bolso del trabajo [CONFIRMAR horario real de su clase]"},{"t":"0:03–0:10","voz":"Tengo dos hijos y no pude ir a la universidad a los dieciocho [CONFIRMAR su historia].","cta":false,"extra":"En pantalla: \"No pude a los 18\" · Imagen: se sienta, saca el cuaderno"},{"t":"0:10–0:14","voz":"Empezar a los treinta también se vale.","cta":false,"extra":"En pantalla: \"A los 30 se vale\" · Imagen: a cámara, sonrisa"},{"t":"0:14–0:24","voz":"Aquí en Uniremington Armenia estudio Contaduría sin dejar mi trabajo, y en la casa ya me piden que les ayude con las cuentas.","cta":false,"extra":"En pantalla: \"Sin dejar mi trabajo [CONFIRMAR modalidad]\" · Imagen: participa en clase, el profesor le revisa el ejercicio"},{"t":"0:24–0:30","voz":"Si estás donde yo estaba, comenta CONTADOR y te mandamos el plan de estudios.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: a cámara, el salón detrás"}],"why":"una mamá real que estudia es la prueba más fuerte para otra mamá que duda. Le quita la culpa por la edad sin que la universidad tenga que decirlo.","alts":"(POV, viral-hooks #068) \"POV: eres mamá y por fin estás estudiando lo que querías.\" 9/10 · (Antes y después) \"A los dieciocho no pude. A los treinta estoy en clase.\" 9/10","gancho":"En plena escena","estructura":"Testimonio","para":"Confianza"},{"n":6,"name":"Emprendedores de WhatsApp","dur":"30 s","hook":"'Me va bien, vendo harto por WhatsApp.' ¿Y cuánto te quedó?","beats":[{"t":"0:00–0:03","voz":"'Me va bien, vendo harto por WhatsApp.' ¿Y cuánto te quedó?","cta":false,"extra":"En pantalla: \"Vender no es *ganar*\" · Imagen: segundo 0: el estudiante le muestra al profesor su celular lleno de pedidos; el profesor pregunta"},{"t":"0:03–0:09","voz":"Si no restas lo que te costó cada producto, el envío y lo que te cobra el banco, no sabes.","cta":false,"extra":"En pantalla: \"Producto + envío + banco\" · Imagen: el profesor anota los tres gastos en el tablero"},{"t":"0:09–0:13","voz":"Eso es lo primero que te pregunta un contador.","cta":false,"extra":"En pantalla: \"La pregunta del contador\" · Imagen: el profesor a cámara"},{"t":"0:13–0:16","voz":"Y la respuesta asusta a más de uno.","cta":false,"extra":"En pantalla: \"Asusta\" · Imagen: el estudiante hace la cuenta y abre los ojos"},{"t":"0:16–0:24","voz":"Anota cada venta y cada gasto en una hoja. A fin de mes, resta. Lo que queda es lo que ganaste.","cta":false,"extra":"En pantalla: \"Ventas − gastos = ganancia\" · Imagen: los dos frente a una hoja de cálculo sencilla"},{"t":"0:24–0:30","voz":"Si te gustan estos números, comenta CONTADOR y te contamos cómo estudiar Contaduría en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: estudiante y profesor a cámara"}],"why":"hoy cualquiera vende por WhatsApp. La mini escena entre estudiante y profesor engancha más que alguien hablando solo, y enseña algo que se puede hacer hoy.","alts":"(Por qué pasa, viral-hooks #051) \"¿Por qué vendes tanto y nunca te alcanza?\" 9/10 · (El costo oculto) \"Vender por WhatsApp sin anotar los gastos te está dejando sin ganancia.\" 8/10","gancho":"Sus propias palabras","estructura":"Embudo actuado","para":"Atraer"},{"n":7,"name":"Elegir carrera","dur":"35 s","hook":"¿Contaduría o Administración? Si dudas entre las dos, mira esta diferencia.","beats":[{"t":"0:00–0:03","voz":"¿Contaduría o Administración? Si dudas entre las dos, mira esta diferencia.","cta":false,"extra":"En pantalla: \"Contaduría *vs* Administración\" · Imagen: segundo 0: el profesor en el pasillo, entre dos puertas con los letreros"},{"t":"0:03–0:11","voz":"Administración te enseña a dirigir el negocio: las personas, las ventas, las decisiones.","cta":false,"extra":"En pantalla: \"Administración: dirigir\" · Imagen: el profesor señala la puerta de Administración"},{"t":"0:11–0:19","voz":"Contaduría te enseña a leer la plata del negocio y a responder por ella con tu firma.","cta":false,"extra":"En pantalla: \"Contaduría: la plata y la firma\" · Imagen: abre la puerta de Contaduría; adentro, estudiantes revisando estados financieros"},{"t":"0:19–0:23","voz":"Y hay una pregunta que te dice cuál es para ti.","cta":false,"extra":"En pantalla: \"La pregunta\" · Imagen: el profesor a cámara"},{"t":"0:23–0:30","voz":"Si te gusta dirigir equipos y hablar con gente, Administración. Si te gusta el detalle y que todo cuadre, Contaduría.","cta":false,"extra":"En pantalla: \"¿Equipos o detalle?\" · Imagen: señala una puerta y luego la otra"},{"t":"0:30–0:35","voz":"Si es la segunda, comenta CONTADOR y te contamos cómo estudiarla en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: el profesor entra al salón de Contaduría"}],"why":"mucha gente duda entre estas dos carreras. Las dos puertas hacen visual la decisión, y quien se identifica con \"el detalle\" entra con el profesor.","alts":"(Elige) \"¿Te gusta dirigir o que todo cuadre? Tu carrera depende de eso.\" 9/10 · (El error) \"El error de escoger Administración cuando lo tuyo era Contaduría.\" 8/10","gancho":"A vs B","estructura":"Comparativo","para":"Confianza"},{"n":8,"name":"Auxiliares sin título","dur":"30 s","hook":"Ocho años de auxiliar contable, y siempre firmaba otro [CONFIRMAR años].","beats":[{"t":"0:00–0:03","voz":"Ocho años de auxiliar contable, y siempre firmaba otro [CONFIRMAR años].","cta":false,"extra":"En pantalla: \"Yo hacía. *Otro firmaba.*\" · Imagen: segundo 0: el estudiante a cámara en el salón, con una carpeta de informes en la mano"},{"t":"0:03–0:10","voz":"Sabía de nómina, de impuestos y de cuadrar la caja. Me faltaba el título para firmar con mi nombre.","cta":false,"extra":"En pantalla: \"Me faltaba el título\" · Imagen: abre la carpeta y señala la línea de la firma"},{"t":"0:10–0:14","voz":"Y lo que ya sabía no se perdió.","cta":false,"extra":"En pantalla: \"Lo que sabía cuenta\" · Imagen: corte a clase, levanta la mano para participar"},{"t":"0:14–0:24","voz":"Aquí en Uniremington Armenia estudio Contaduría sin dejar mi trabajo, y lo que hago cada día me sirve en clase [CONFIRMAR modalidad].","cta":false,"extra":"En pantalla: \"Sin dejar mi trabajo\" · Imagen: explica un ejercicio a sus compañeros en el tablero"},{"t":"0:24–0:30","voz":"Si estás como yo estaba, comenta CONTADOR, te mandamos el plan de estudios y decides con calma.","cta":true,"extra":"En pantalla: \"Pide el plan de estudios\" · Imagen: a cámara"}],"why":"el auxiliar que duda se ve en el estudiante. La oferta baja el esfuerzo (sin dejar el trabajo), sube la confianza (lo que sabe cuenta) y cierra con un objeto concreto, sin presión.","alts":"(Sus propias palabras) \"'¿Para qué estudio si ya sé hacer todo?' Eso pensaba yo.\" 9/10 · (Lo que nadie dice, viral-hooks #093) \"Nadie habla de lo que se siente hacer el trabajo y que firme otro.\" 8/10","gancho":"Antes y después","estructura":"Testimonio con oferta","para":"Vender"},{"n":9,"name":"Una clase real","dur":"35 s","hook":"Así es una clase real de Contaduría en Uniremington Armenia.","beats":[{"t":"0:00–0:03","voz":"Así es una clase real de Contaduría en Uniremington Armenia.","cta":false,"extra":"En pantalla: \"Una clase *por dentro*\" · Imagen: segundo 0: la puerta del salón se abre y se ve la clase andando"},{"t":"0:03–0:11","voz":"Primero, el profe trae un caso: una tienda que vende bien y no sabe por qué no le alcanza.","cta":false,"extra":"En pantalla: \"El caso de la tienda\" · Imagen: el profesor proyecta las ventas de una tienda de ejemplo"},{"t":"0:11–0:18","voz":"En grupos sacamos las cuentas: lo que entra, lo que sale y por dónde se va la plata.","cta":false,"extra":"En pantalla: \"Entra, sale, se va\" · Imagen: grupos de estudiantes con calculadoras y cuadernos"},{"t":"0:18–0:22","voz":"Y la parte que más me gusta llega al final.","cta":false,"extra":"En pantalla: \"La mejor parte\" · Imagen: corte rápido"},{"t":"0:22–0:30","voz":"Cuando encontramos el error y el profe nos pide explicárselo al dueño como si estuviera ahí.","cta":false,"extra":"En pantalla: \"Encontramos el error\" · Imagen: un estudiante explica al frente, el profesor hace de dueño de la tienda"},{"t":"0:30–0:35","voz":"Si te ves en esta clase, comenta CONTADOR y te contamos cómo entrar a Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: el estudiante a cámara, el salón detrás"}],"why":"mostrar una clase real es la mejor prueba de cómo se estudia. Rompe la idea de que Contaduría es aburrida y deja que el aspirante se imagine ahí.","alts":"(Detrás de cámaras, viral-hooks #100) \"Detrás de cámaras de una clase de Contaduría.\" 8/10 · (Lista corta) \"Tres cosas que hacemos en clase de Contaduría y nadie se imagina.\" 8/10","gancho":"Detrás del resultado","estructura":"Detrás de cámaras","para":"Confianza"},{"n":10,"name":"Tu conjunto residencial","dur":"30 s","hook":"Este papel de la asamblea de tu conjunto lo hizo un contador.","beats":[{"t":"0:00–0:03","voz":"Este papel de la asamblea de tu conjunto lo hizo un contador.","cta":false,"extra":"En pantalla: \"¿Lo has *leído*?\" · Imagen: segundo 0: el profeso , flojo en especificidad · (Antes y después) \"Toda la cosecha vendida. Cero pesos en el bolsillo.\" 9/10","gancho":"No fue eso","estructura":"Embudo","para":"Atraer"},{"n":2,"name":"¿Hay que ser un genio?","dur":"30 s","hook":"¿Para estudiar Contaduría hay que ser un genio en matemáticas? No.","beats":[{"t":"0:00–0:03","voz":"¿Para estudiar Contaduría hay que ser un genio en matemáticas? No.","cta":false,"extra":"En pantalla: \"Sumar y *restar*\" · Imagen: segundo 0: alguien mira una calculadora con cara de susto"},{"t":"0:03–0:11","voz":"Necesitas sumar, restar, sacar porcentajes y ser ordenado con tus cosas. Las cuentas largas las hace el computador por ti.","cta":false,"extra":"En pantalla: \"Las cuentas largas: el computador\" · Imagen: el computador hace una suma larga en un segundo"},{"t":"0:11–0:15","voz":"Lo que sí necesitas es otra cosa.","cta":false,"extra":"En pantalla: \"Lo que sí necesitas\" · Imagen: corte a cámara"},{"t":"0:15–0:25","voz":"Paciencia para revisar y ganas de entender por qué no cuadra la plata. Como cuando la cuenta del almuerzo no cuadra y tú eres el que revisa quién no pagó.","cta":false,"extra":"En pantalla: \"¿Quién no pagó?\" · Imagen: grupo de amigos en una mesa, alguien revisa la cuenta"},{"t":"0:25–0:30","voz":"Si ese eres tú, comenta CONTADOR y te contamos cómo estudiarla en Uniremington Armenia.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: a cámara, sonrisa"}],"why":"responde en el primer segundo el miedo más común (\"soy malo para las matemáticas\") y cambia la pregunta: no es de inteligencia, es de carácter. El ejemplo del almuerzo hace que el espectador se reconozca.","alts":"(Mito y realidad, viral-hooks #079) \"Mito: Contaduría es para genios. Realidad: es para ordenados.\" 9/10 · (Sus propias palabras) \"'Yo soy malo para los números.' Para Contaduría no hace falta ser bueno.\" 8/10","gancho":"La pregunta que le hacen","estructura":"Respuesta a objeción","para":"Confianza"},{"n":3,"name":"Tarde sale const RULES=`Eres el guionista de video corto (Reels, TikTok, Shorts) de un asesor comercial de universidades en Colombia. Escribes guiones de nivel profesional, nunca genéricos. Respondes en español de Colombia, cercano y natural.

NICHO (fijo)
El nicho es educación: el objetivo de todo guion es que más personas quieran estudiar Contaduría Pública en Uniremington. Si el usuario no dice otra cosa, cada guion es para Uniremington y Contaduría Pública, aunque el pedido sea un tema suelto. Los guiones de embudo pueden abrir con un tema amplio, pero siempre aterrizan en la decisión de estudiar (la carrera, el título, la tarjeta profesional, cómo se estudia en Uniremington) y cierran con un pedido ligado a estudiar. Un guion que entretiene pero no acerca a estudiar Contaduría no sirve. Todos los guiones cierran invitando a ponerse en contacto ya y matricularse en Uniremington Armenia (ejemplo: "Escríbenos hoy al WhatsApp y matricúlate en Uniremington Armenia."), con el número en pantalla como [CONFIRMAR WhatsApp]. Sin urgencia falsa. Solo cambia de programa o universidad si el usuario lo pide explícitamente.

QUÉ ENTREGAS
Por defecto 6 opciones MUY distintas entre sí (si el usuario pide otro número, ese número, máximo 10). Cada opción usa una fórmula de gancho diferente y una estructura diferente. Si el usuario dice que le gusta una opción, conserva su ADN (fórmula de gancho, estructura, ritmo, duración, tipo de cierre) y cambia el contenido hacia lo que pida (otro programa, otra universidad, otro tema, otro ángulo).
No todo guion es sobre un programa: si el usuario da un tema o idea libre, trabaja sobre eso.

MÉTODO (obligatorio)
1. Al menos la mitad de la tanda va en EMBUDO: abre con un tema que le importa a mucha gente (dinero, impuestos, la DIAN, Nequi, la IA y el empleo, el trabajo, la familia, una escena cotidiana colombiana) y gira al programa entre el 20 % y el 35 % del guion. El resto: historia vivida, prueba en pantalla, respuesta a una objeción u oferta. Roles: ~60 % Atraer, ~25 % Confianza, ~15 % Vender.
2. Gancho: lo primero que se dice, 12 palabras o menos, con un dato concreto (número, marca, escena) y algo visible en el segundo 0. Nunca saludo, nunca "en este video", nunca "¿sabías que…?" con algo obvio, nunca pregunta de sí/no obvia.
3. Fórmulas de gancho (usa una distinta por opción y nómbrala): Todavía atascado ("Haces X y aún Y"), El costo oculto ("[hábito normal] te está costando [pérdida concreta]"), Sus propias palabras (una frase real que dice el público + respuesta corta que la voltea), La voltereta ("[consejo común] es justo por qué [problema]"), Para y empieza, Lo que nadie dice, Número + resultado, Tiempo exprés, La lista corta (2 o 3), El error, Al revés, En plena escena (empieza en mitad del momento, sin contexto), Antes y después, La confesión, Cómo, sin [el dolor], El atajo, No fue eso ("[resultado], y no fue por [causa obvia]"), A vs B, La pregunta que le hacen, El recibo (mostrar prueba en pantalla), Detrás del resultado, Responder una idea popular.
4. Cuerpo: una idea por video. Una frase por línea (4 a 15 palabras). Concreto antes que abstracto; nunca tres frases abstractas seguidas. Habla a una persona ("tú"). Un reenganche entre el 40 % y el 60 % (un giro, un número, "esta es la parte que nadie hace"). Una sola promesa del gancho al cierre.
5. Cierre: un solo pedido, en una línea, que ofrezca algo concreto (comentar una palabra para recibir el plan de estudios, guardar, compartir con alguien específico, seguir). Nunca "gracias por ver" ni resumen.
6. Duración: 2,7 palabras por segundo. La mayoría entre 25 y 40 s (70 a 110 palabras). Respeta la duración que pida el usuario.
7. Prohibido sonar a IA: nada de "no es X, es Y", tríadas de adjetivos, frases sueltas tipo "Sin rodeos. Sin excusas.", preguntas que se responden solas ("¿El resultado?"), "descubre", "potencia", "transforma tu vida", "en el mundo actual", "sin duda", "clave del éxito", "no te lo pierdas".
8. Verdad y cumplimiento: nunca prometas empleo, salario, ascenso, "garantizado", "100 %", "la mejor universidad", ni urgencia falsa ("últimos cupos" sin fecha real). No nombres ni ataques a otras universidades. No inventes cifras, acreditaciones, precios, fechas, testimonios ni nombres: lo que no esté en los datos de abajo o en lo que diga el usuario va como [CONFIRMAR: qué]. Los datos de normas o impuestos solo si son ciertos; lo que cambie cada año, [CONFIRMAR].

}
function compact(m){ // lo que el modelo recuerda de una respuesta anterior
  return (m.options||[]).map(o=>`Opción ${o.n} · ${o.name} (${o.gancho}; ${o.estructura}; ${o.dur}; ${o.para}). Gancho: "${o.hook}". Guion: ${o.beats.map(b=>b.voz).join(" ")}`).join("\n");
}

function card(o,mi){
  return `<article class="card">
    <div class="thumb"><div class="top"><span>Opción ${o.n}</span><span>${esc(o.dur)}</span></div><p class="hook"><span>${esc(o.hook)}</span></p></div>
    <div class="body"><h3>${esc(o.name)}</h3>
      <p class="meta">${esc([o.gancho&&o.gancho.replace(/\s*\(\d+\)/,""),o.estructura,o.para].filter(Boolean).join(" · "))}</p>
      ${o.why?`<p class="why">${esc(cap(o.why))}</p>`:""}
      <details><summary>Ver guion completo</summary>
        <ol class="beats">${o.beats.map(b=>`<li class="${b.cta?"cta":""}"><time>${esc(b.t)}</time><div>${esc(b.voz)}${b.extra?`<span class="extra">${esc(b.extra)}</span>`:""}</div></li>`).join("")}</ol>
        ${o.alts?`<p class="alts">Otros ganchos: ${esc(o.alts)}</p>`:""}
      </details></div>
    <div class="actions"><button class="btn" type="button" data-more="${mi}:${o.n}">Quiero más como este</button><button class="btn quiet" type="button" data-copy="${mi}:${o.n}">Copiar</button></div>
  </article>`;
}
function render(){
  $("thread").innerHTML=msgs.map((m,i)=>{
    if(m.role==="user")return `<div class="me">${esc(m.text)}</div>`;
    const opts=m.options||[];
    return `<section class="ai">
      ${m.intro?`<p class="intro">${esc(m.intro)}</p>`:""}
      ${opts.length?`<div class="grid">${opts.map(o=>card(o,i)).join("")}</div>`:""}
      ${m.streaming?`<p class="thinking"><span class="dot"></span>${opts.length?"Escribiendo la siguiente opción…":"Pensando la tanda… (puede tardar un minuto)"}</p>`:""}
      ${m.error?`<p class="err">${esc(m.error)}</p>`:""}
      ${m.pending&&m.pending.length?`<div class="pending">Por confirmar antes de publicar:<ul>${m.pending.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
    </section>`}).join("");
}
function scrollEnd(){window.scrollTo({top:document.body.scrollHeight,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}

const CHIPS=["Guiones para auxiliares contables que no tienen el título","5 videos sobre la DIAN que lleven a estudiar Contaduría","Guiones para bachilleres buenos con los números"];
function renderChips(){$("chips").innerHTML=CHIPS.map(c=>`<button class="chip" type="button">${esc(c)}</button>`).join("")}

const COPY={not_granted:"La página no tiene permiso para usar Claude. Puedes darlo desde el menú de permisos del artifact, o pedir los guiones en el chat de Claude Code.",
  sampling_disabled:"Claude no está disponible para esta cuenta desde esta página. Pide los guiones en el chat de Claude Code.",
  rate_limited:"Llegaste al límite de uso por ahora. Espera un rato y vuelve a intentar.",
  session_expired:"Tu sesión expiró. Vuelve a iniciar sesión en claude.ai.",
  refused:"Claude no quiso responder ese pedido. Cámbialo un poco y vuelve a intentar.",
  prompt_too_large:"La conversación es muy larga. Empieza una nueva conversación.",
  invalid_json:"No pude leer la respuesta completa. Intenta de nuevo."};

async function ask(text){
  if(busy||!text.trim())return;
  if(sample===undefined)sample=await claude.use("sample").catch(()=>null);
  if(!sample){$("status").textContent="Esta vista no puede usar Claude. Ábrela en claude.ai o pide los guiones en el chat de Claude Code.";return}
  busy=true; $("send").textContent="Detener"; $("msg").value="";
  msgs.push({role:"user",text});
  const turns=[{role:"user",content:RULES}];
  for(const m of msgs.slice(-9)){
    if(m.role==="user")turns.push({role:"user",content:m.text});
    else if(m.options&&m.options.length)turns.push({role:"assistant",content:compact(m)});
  }
  const ai={role:"assistant",intro:"",options:[],pending:[],streaming:true}; msgs.push(ai); render(); scrollEnd();
  ctl=new AbortController(); let pend="";
  const eat=line=>{line=line.trim().replace(/^```\w*|```$/g,"").trim(); if(!line)return;
    let o; try{o=JSON.parse(line)}catch(e){return}
    if(o.t==="intro")ai.intro=o.texto||"";
    else if(o.t==="opcion")ai.options.push(fromGen(o,ai.options.length+1));
    else if(o.t==="fin")ai.pending=Array.isArray(o.confirmar)?o.confirmar:[];
    render();};
  try{
    await sample(turns,{cache:false,signal:ctl.signal,onText:({delta})=>{const ls=(pend+delta).split("\n");pend=ls.pop();ls.forEach(eat)}});
    eat(pend);
    if(!ai.options.length)ai.error="No pude leer los guiones de la respuesta. Intenta de nuevo o pide menos opciones.";
  }catch(e){
    eat(pend);
    if(e&&e.code==="cancelled"){if(!ai.options.length)ai.error="Detenido."}
    else ai.error=(e&&COPY[e.code])||"Se cortó la conexión. Intenta de nuevo.";
    if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"))$("status").textContent=COPY[e.code];
  }finally{
    ai.streaming=false; busy=false; $("send").textContent="Generar"; render(); save();
  }
}

$("composer").addEventListener("submit",e=>{e.preventDefault(); if(busy){ctl&&ctl.abort();return} ask($("msg").value)});
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){$("msg").value=b.textContent;$("msg").focus()}});
$("thread").addEventListener("click",e=>{
  const more=e.target.closest("[data-more]"), cp=e.target.closest("[data-copy]");
  const pick=el=>{const [mi,n]=el.dataset[el.dataset.more!==undefined?"more":"copy"].split(":");return msgs[+mi].options.find(o=>String(o.n)===n)};
  if(more){const o=pick(more);
    $("msg").value=`Me gusta la opción ${o.n}, "${o.name}". Hazme 5 más con ese mismo ADN (gancho tipo ${o.gancho}, ${o.estructura}, ${o.dur}) para `;
    $("msg").focus(); const L=$("msg").value.length; $("msg").setSelectionRange(L,L); scrollEnd();}
  if(cp){const o=pick(cp);
    const txt=`${o.name} (${o.dur})\n\n`+o.beats.map(b=>`[${b.t}] ${b.voz}${b.extra?"\n   "+b.extra:""}`).join("\n");
    const done=m=>{cp.textContent=m;setTimeout(()=>cp.textContent="Copiar",1500)};
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>done("Copiado"),()=>done("No se pudo"));}
});
$("reset").addEventListener("click",()=>{if(busy)return; msgs=seedThread(); save(); render(); window.scrollTo({top:0})});

msgs=load(); renderChips(); render();
claude.use("sample").then(s=>{sample=s; if(!s)$("status").textContent="Esta vista no puede usar Claude. Ábrela en claude.ai o pide los guiones en el chat de Claude Code.";}).catch(()=>{sample=null});
</script>
