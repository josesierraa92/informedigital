<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Guiones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Una sola tarea: leer las opciones de una tanda y elegir la favorita.
   La miniatura oscura con el gancho en subtítulo coral es la pieza fuerte; el resto, tranquilo. */
:root{
  --paper:#f4f5fa; --surface:#ffffff; --ink:#1d1b3a; --muted:#5f5e79; --line:#dcdde9;
  --cobalt:#3043e6; --on-cobalt:#ffffff; --coral:#ff6a3d; --thumb:#1b1a40;
  --f-display:"Unbounded","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111126; --surface:#1b1a35; --ink:#ecebfa; --muted:#a6a5c4; --line:#2f2e55;
  --cobalt:#8e99ff; --on-cobalt:#0e0f2a; --coral:#ff8a63; --thumb:#0a0a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);padding-block:32px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font:700 clamp(28px,5vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--muted);font-size:17px;margin-top:10px;max-width:56ch}
header{display:grid;gap:18px;margin-bottom:30px}
select{font:600 16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:100%}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{background:radial-gradient(110% 80% at 15% 0%,#3a3f9e 0%,transparent 60%),radial-gradient(90% 70% at 100% 100%,#7a2f5a 0%,transparent 65%),var(--thumb);
  color:#fff;padding:22px 20px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.thumb .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.85}
.hook{font:700 19px/1.5 var(--f-display)}
.hook span{background:var(--coral);color:#1b0b05;padding:2px 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.body{padding:18px 20px 20px;display:grid;gap:10px;flex:1;align-content:start}
.body h2{font:700 19px/1.3 var(--f-body)}
.meta{color:var(--muted);font-size:14px}
.why{font-size:15px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--cobalt);font-size:15px}
.beats{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.beats li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;font-size:15px}
.beats time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.beats .cta time{color:var(--coral);font-weight:600}
.beats .extra{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.alts{margin-top:12px;font-size:14px;color:var(--muted)}
.pick{margin-top:auto;padding:0 20px 20px}
.btn{width:100%;border:0;border-radius:999px;padding:12px 18px;font:700 15px var(--f-body);background:var(--cobalt);color:var(--on-cobalt);cursor:pointer}
.btn.done{background:var(--ink);color:var(--paper)}
.pending{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:10px;max-width:70ch}
.pending h2{font:700 18px/1.3 var(--f-body)}
.pending ul{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="title">Guiones</h1>
      <p class="lede">Lee las opciones y quédate con la que más te guste. El botón copia el pedido; pégalo en el chat y te hago más con esa misma fórmula.</p>
    </div>
    <label id="pickerWrap" hidden>
      <span class="meta" style="display:block;margin-bottom:6px">Tanda</span>
      <select id="picker"></select>
    </label>
  </header>
  <div class="grid" id="grid"></div>
  <section class="pending" id="pending" hidden>
    <h2>Por confirmar antes de publicar</h2>
    <ul id="pendingList"></ul>
  </section>
</div>

<script>
const DATA=[{"file":"2026-11-13_uniremington_contaduria.md","title":"Uniremington · Contaduría Pública","options":[{"n":1,"name":"La DIAN ya lo sabe","dur":"35 s","hook":"Lo que te consignan por Nequi, la DIAN también lo ve.","beats":[{"t":"0:00–0:03","voz":"Lo que te consignan por Nequi, la DIAN también lo ve.","cta":false,"extra":"En pantalla: \"La DIAN *ya lo sabe*\" · Imagen: segundo 0: celular con la notificación de una consignación"},{"t":"0:03–0:10","voz":"Bancos y billeteras le reportan a la DIAN información de tus cuentas cada año. Se llama información exógena.","cta":false,"extra":"En pantalla: \"Información exógena\" · Imagen: pantallazo de la página de la DIAN"},{"t":"0:10–0:19","voz":"Si en el año te consignan 1.400 UVT o más, o te entran ingresos por ese monto, te toca declarar renta, así seas independiente.","cta":false,"extra":"En pantalla: \"1.400 UVT = [CONFIRMAR pesos del año]\" · Imagen: la cifra grande en pantalla"},{"t":"0:19–0:23","voz":"Y aquí está lo que casi nadie piensa.","cta":false,"extra":"En pantalla: \"Ojo\" · Imagen: corte a cámara, más cerca"},{"t":"0:23–0:32","voz":"Del otro lado de cada reporte siempre hay un contador. Es la persona que sabe qué sabe la DIAN de ti, antes que tú.","cta":false,"extra":"En pantalla: \"Contaduría Pública\" · Imagen: a cámara; al final, logo Uniremington"},{"t":"0:32–0:35","voz":"Sígueme y te enseño a leer tu propia exógena.","cta":true,"extra":"En pantalla: \"Sígueme\" · Imagen: a cámara"}],"why":"casi todo el que usa Nequi se detiene; el dato de las 1.400 UVT es útil y se comparte, y el giro a Contaduría llega cuando ya están enganchados. La perla (\"sabe qué sabe la DIAN de ti, antes que tú\") es la frase que se queda.","alts":"(El costo oculto) \"Ese Nequi que usas para todo te puede obligar a declarar renta.\" · (La pregunta que le hacen) \"¿La DIAN ve mi Nequi? Sí, y te explico qué ve.\"","gancho":"Lo que nadie dice (6)","estructura":"Embudo, puerta grande","para":"Atraer"},{"n":2,"name":"Tu cédula decide","dur":"35 s","hook":"Los dos últimos números de tu cédula deciden cuándo te pueden multar.","beats":[{"t":"0:00–0:03","voz":"Los dos últimos números de tu cédula deciden cuándo te pueden multar.","cta":false,"extra":"En pantalla: \"Tu cédula *decide*\" · Imagen: segundo 0: un dedo tapa una cédula y solo se ven los dos últimos dígitos"},{"t":"0:03–0:11","voz":"La DIAN reparte los vencimientos de renta de personas entre agosto y octubre según esos dos dígitos. Si se te pasa tu día, ya llegaste tarde.","cta":false,"extra":"En pantalla: \"Agosto a octubre [CONFIRMAR calendario]\" · Imagen: calendario con días marcados"},{"t":"0:11–0:18","voz":"Y declarar tarde tiene una sanción mínima de 10 UVT, aunque no debas ni un peso de impuesto.","cta":false,"extra":"En pantalla: \"Mínimo 10 UVT\" · Imagen: la cifra en rojo"},{"t":"0:18–0:22","voz":"Ahora, mira quién se sabe ese calendario de memoria.","cta":false,"extra":"En pantalla: \"¿Quién?\" · Imagen: corte rápido"},{"t":"0:22–0:31","voz":"Los contadores. Para ellos agosto es como diciembre para un comerciante: el mes en que todo el mundo los necesita al mismo tiempo.","cta":false,"extra":"En pantalla: \"Agosto = diciembre\" · Imagen: escritorio lleno de carpetas, teléfono sonando"},{"t":"0:31–0:35","voz":"Comenta tus dos últimos números y te digo tu fecha.","cta":true,"extra":"En pantalla: \"Comenta tus 2 números\" · Imagen: a cámara"}],"why":"convierte un trámite aburrido en algo personal (tu cédula), da un dato que ahorra plata y el cierre dispara cientos de comentarios porque cada persona quiere su fecha. Requiere que alguien responda los comentarios.","alts":"(Especificidad) \"Hay un día exacto del año en que la DIAN te empieza a cobrar.\" · (Lo que nadie dice) \"Declarar tarde te cuesta plata aunque no debas impuesto.\"","gancho":"El costo oculto (2)","estructura":"Embudo, puerta mediana","para":"Atraer"},{"n":3,"name":"Vende todo y quiebra","dur":"35 s","hook":"Una tienda puede vender todos los días y quebrar igual.","beats":[{"t":"0:00–0:03","voz":"Una tienda puede vender todos los días y quebrar igual.","cta":false,"extra":"En pantalla: \"Vende todo. *Quiebra.*\" · Imagen: segundo 0: persiana de un local bajando"},{"t":"0:03–0:11","voz":"Pasa así: vendes un millón en el mes, pero le fías la mitad a los clientes y el arriendo se paga el primero.","cta":false,"extra":"En pantalla: \"$1.000.000 vendido\" · Imagen: cuaderno de fiados, recibo de arriendo"},{"t":"0:11–0:18","voz":"En el papel ganaste. En la caja no hay con qué pagar.","cta":false,"extra":"En pantalla: \"Caja: $0\" · Imagen: caja registradora vacía"},{"t":"0:18–0:22","voz":"Y casi ningún dueño lo ve venir.","cta":false,"extra":"En pantalla: \"Nadie lo ve venir\" · Imagen: a cámara"},{"t":"0:22–0:31","voz":"Eso se llama flujo de caja, y es lo primero que revisa un contador cuando entra a un negocio: la plata que de verdad entra y sale, mes a mes.","cta":false,"extra":"En pantalla: \"Flujo de caja\" · Imagen: tabla simple de entradas y salidas"},{"t":"0:31–0:35","voz":"Guárdalo y mándaselo a alguien que tenga negocio.","cta":true,"extra":"En pantalla: \"Mándaselo\" · Imagen: a cámara, señala la pantalla"}],"why":"todo el mundo conoce un negocio que cerró \"aunque se llenaba\". Se comparte con familiares que tienen negocio, y deja la idea de que el contador es quien evita eso.","alts":"(No fue eso) \"Este negocio se llenaba todos los días y cerró. No fue por ventas.\" · (El error) \"El error que cierra más tiendas de barrio no es vender poco.\"","gancho":"No fue eso (17)","estructura":"Embudo, puerta grande","para":"Atraer"},{"n":4,"name":"La IA no firma","dur":"35 s","hook":"La IA ya hace contabilidad. Y los contadores van a valer más.","beats":[{"t":"0:00–0:03","voz":"La IA ya hace contabilidad. Y los contadores van a valer más.","cta":false,"extra":"En pantalla: \"IA vs *contador*\" · Imagen: segundo 0: un chat de IA generando un asiento contable"},{"t":"0:03–0:10","voz":"Es cierto: una IA clasifica facturas y cuadra extractos en segundos. Por eso mucha gente cree que la carrera se acaba.","cta":false,"extra":"En pantalla: \"Facturas en segundos\" · Imagen: grabación de pantalla rápida"},{"t":"0:10–0:16","voz":"Pero hay algo que la ley no le deja hacer a una máquina: firmar.","cta":false,"extra":"En pantalla: \"Firmar\" · Imagen: mano firmando un estado financiero"},{"t":"0:16–0:27","voz":"Los estados financieros y las declaraciones grandes necesitan la firma de un contador público con tarjeta profesional, que responde con su nombre si algo sale mal.","cta":false,"extra":"En pantalla: \"Tarjeta profesional\" · Imagen: tarjeta profesional [CONFIRMAR imagen autorizada]"},{"t":"0:27–0:32","voz":"La IA hace el trabajo pesado. La responsabilidad sigue teniendo nombre y apellido.","cta":false,"extra":"En pantalla: \"Nombre y apellido\" · Imagen: a cámara"},{"t":"0:32–0:35","voz":"¿Tú qué crees? Comenta IA o CONTADOR.","cta":true,"extra":"En pantalla: \"¿IA o CONTADOR?\" · Imagen: a cámara"}],"why":"\"la IA acaba con los empleos\" es un debate en el que todos tienen opinión. Toma partido, lo defiende con un hecho legal real (la firma) y el cierre invita a votar en comentarios, que es lo que el algoritmo premia.","alts":"(Responder una idea) \"Dicen que la IA acaba con los contadores. Mira lo que no puede hacer.\" · (El costo oculto) \"Lo único que la IA no puede hacer en contabilidad es lo que más vale.\"","gancho":"La voltereta (4)","estructura":"Opinión que divide","para":"Atraer y comentarios"},{"n":5,"name":"Día de vencimiento","dur":"36 s","hook":"Día de vencimiento, cuatro de la tarde, y las facturas llegan en fotos.","beats":[{"t":"0:00–0:04","voz":"Día de vencimiento, cuatro de la tarde, y las facturas llegan en fotos.","cta":false,"extra":"En pantalla: \"Vence hoy. *4 p. m.*\" · Imagen: segundo 0: chat de WhatsApp lleno de fotos de facturas"},{"t":"0:04–0:12","voz":"Cuarenta fotos, la mitad borrosas, y una es la cuenta de un almuerzo. Así se ve la contabilidad de un negocio pequeño.","cta":false,"extra":"En pantalla: \"40 fotos\" · Imagen: pasar las fotos rápido"},{"t":"0:12–0:20","voz":"En ese momento tienes que decidir qué sirve, qué no y qué se puede presentar hoy sin inventar nada.","cta":false,"extra":"En pantalla: \"Sirve / no sirve\" · Imagen: separar facturas en dos montones"},{"t":"0:20–0:24","voz":"Esa parte no sale en ningún libro.","cta":false,"extra":"En pantalla: \"No sale en libros\" · Imagen: a cámara"},{"t":"0:24–0:33","voz":"Se aprende con casos. Por eso en Uniremington los estudiantes de Contaduría practican en un consultorio contable con negocios de verdad.","cta":false,"extra":"En pantalla: \"Consultorio contable [CONFIRMAR]\" · Imagen: estudiantes atendiendo un caso"},{"t":"0:33–0:36","voz":"Si esto te parece un reto divertido, comenta CONTADOR.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: a cámara, sonrisa"}],"why":"empieza en plena escena, sin presentación, y muestra el oficio real con humor. Quien se ríe y piensa \"eso me gustaría resolverlo\" es justo el aspirante correcto.","alts":"(Confesión) \"La primera vez que me mandaron facturas por WhatsApp, quise renunciar.\" [CONFIRMAR que sea real] · (Antes y después) \"Cuarenta fotos borrosas a las 4. Declaración presentada a las 6.\"","gancho":"En plena escena (12)","estructura":"Historia vivida","para":"Confianza"},{"n":6,"name":"El consultorio por dentro","dur":"26 s","hook":"Así se ve por dentro el consultorio contable virtual de Uniremington.","beats":[{"t":"0:00–0:03","voz":"Así se ve por dentro el consultorio contable virtual de Uniremington.","cta":false,"extra":"En pantalla: \"El consultorio *por dentro*\" · Imagen: segundo 0: grabación de pantalla del consultorio"},{"t":"0:03–0:12","voz":"Llega un caso: un emprendedor que no sabe si tiene que facturar electrónicamente. El estudiante lo revisa con un docente y le responde.","cta":false,"extra":"En pantalla: \"Caso real [CONFIRMAR]\" · Imagen: recorrido por la pantalla del caso"},{"t":"0:12–0:19","voz":"Es lo mismo que vas a hacer cuando te gradúes, pero con alguien al lado que te corrige.","cta":false,"extra":"En pantalla: \"Con alguien que te corrige\" · Imagen: comentario del docente en pantalla"},{"t":"0:19–0:23","voz":"Y no esperas al último semestre para hacerlo.","cta":false,"extra":"En pantalla: \"Desde [CONFIRMAR semestre]\" · Imagen: corte a cámara"},{"t":"0:23–0:26","voz":"Comenta CONTADOR y te mandamos el recorrido completo.","cta":true,"extra":"En pantalla: \"Comenta CONTADOR\" · Imagen: a cámara"}],"why":"mostrar la pantalla real es la prueba más fuerte que hay; nadie más puede publicar este video, y el cierre ofrece algo concreto (el recorrido).","alts":"(Detrás del resultado) \"Así responde un estudiante de Contaduría su primer caso real.\" · (Cómo, sin) \"Cómo practicar contabilidad sin tener todavía un trabajo.\"","gancho":"El recibo (20)","estructura":"Prueba en pantalla","para":"Confianza"},{"n":7,"name":"Experiencia te sobra","dur":"30 s","hook":"'Llevo ocho años de auxiliar, ¿para qué estudio?' Para poder firmar.","beats":[{"t":"0:00–0:03","voz":"'Llevo ocho años de auxiliar, ¿para qué estudio?' Para poder firmar.","cta":false,"extra":"En pantalla: \"8 años de auxiliar\" · Imagen: segundo 0: escritorio con facturas; otra persona firma el documento"},{"t":"0:03–0:12","voz":"Haces la conciliación, la nómina y la exógena. Pero el estado financiero lo firma otra persona, y el cliente le confía el negocio a quien firma.","cta":false,"extra":"En pantalla: \"Tú haces. Otro firma.\" · Imagen: a cámara, tono serio"},{"t":"0:12–0:15","voz":"Experiencia te sobra. Te falta el título.","cta":false,"extra":"En pantalla: \"Te falta el título\" · Imagen: corte"},{"t":"0:15–0:25","voz":"La Contaduría Pública virtual de Uniremington la estudias desde la casa, sin soltar tu trabajo, y tiene registro SNIES 104911.","cta":false,"extra":"En pantalla: \"SNIES 104911 [CONFIRMAR vigencia]\" · Imagen: persona estudiando de noche en su portátil"},{"t":"0:25–0:30","voz":"Comenta CONTADOR y te mandamos el plan de estudios.","cta":true,"extra":"En pantalla: \"Pide el plan de estudios\" · Imagen: a cámara"}],"why":"usa la frase exacta que dice el auxiliar contable y la responde en dos palabras (\"para firmar\"). El cierre ofrece un objeto concreto, el plan de estudios, en vez de \"más información\".","alts":"(Todavía atascado) \"Llevas años haciendo la contabilidad y todavía firma otro.\" · (La pregunta que le hacen) \"¿Vale la pena estudiar Contaduría si ya soy auxiliar? Sí, por una razón.\"","gancho":"Sus propias palabras (3)","estructura":"Oferta","para":"Vender"}],"pending":["Valor en pesos de 1.400 UVT y de 10 UVT para el año en que se publique, y el calendario de vencimientos de renta de personas naturales.","Vigencia del SNIES 104911 (Contaduría virtual) y si la acreditación en alta calidad cubre la modalidad virtual.","Si los estudiantes virtuales usan el consultorio contable, desde qué semestre, y si atienden casos reales. Grabación de pantalla con permiso.","Opción 5: docente o egresado real que cuente su experiencia.","Canal oficial del CTA (WhatsApp o formulario) y quién responde los comentarios de la opción 2.","Límite real del concepto: las cifras son pistas de patrones generales; aún no se midió qué es viral en este nicho (falta acceso a YouTube o Treg)."]}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function show(i){
  const t=DATA[i]; if(!t)return;
  $("title").textContent=t.title;
  $("grid").innerHTML=t.options.map(o=>`
    <article class="card">
      <div class="thumb"><div class="top"><span>Opción ${o.n}</span><span>${esc(o.dur)}</span></div>
        <p class="hook"><span>${esc(o.hook)}</span></p></div>
      <div class="body">
        <h2>${esc(o.name)}</h2>
        <p class="meta">${esc([o.gancho&&o.gancho.replace(/\s*\(\d+\)/,""),o.estructura,o.para].filter(Boolean).join(" · "))}</p>
        ${o.why?`<p class="why">${esc(o.why.charAt(0).toUpperCase()+o.why.slice(1))}</p>`:""}
        <details><summary>Ver guion completo</summary>
          <ol class="beats">${o.beats.map(b=>`<li class="${b.cta?"cta":""}"><time>${esc(b.t)}</time><div>${esc(b.voz)}${b.extra?`<span class="extra">${esc(b.extra)}</span>`:""}</div></li>`).join("")}</ol>
          ${o.alts?`<p class="alts">Otros ganchos: ${esc(o.alts)}</p>`:""}
        </details>
      </div>
      <div class="pick"><button class="btn" type="button" data-n="${o.n}">Quiero más como este</button></div>
    </article>`).join("");
  $("pending").hidden=!t.pending.length;
  $("pendingList").innerHTML=t.pending.map(p=>`<li>${esc(p)}</li>`).join("");
  sset("guiones-tanda",String(i));
}
function init(){
  if(!DATA||!DATA.length){$("grid").innerHTML='<p class="empty">Todavía no hay tandas. Pide guiones en el chat y aparecerán aquí.</p>';return}
  if(DATA.length>1){$("pickerWrap").hidden=false;$("picker").innerHTML=DATA.map((t,i)=>`<option value="${i}">${esc(t.title)}</option>`).join("")}
  let i=+(sget("guiones-tanda")||0); if(!(i<DATA.length))i=0; $("picker").value=i; show(i);
  $("picker").addEventListener("change",e=>show(+e.target.value));
  $("grid").addEventListener("click",e=>{
    const b=e.target.closest("[data-n]"); if(!b)return;
    const t=DATA[+$("picker").value||0], o=t.options.find(x=>String(x.n)===b.dataset.n);
    const txt=`Me gusta la opción ${o.n} (${o.name}) de "${t.title}". Hazme más como esa.`;
    const ok=()=>{b.textContent="Copiado. Pégalo en el chat";b.classList.add("done");setTimeout(()=>{b.textContent="Quiero más como este";b.classList.remove("done")},2400)};
    const fail=()=>{b.textContent=`Escribe en el chat: "me gusta la ${o.n}"`;b.classList.add("done")};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fail);else fail();
  });
}
init();
</script>

</body>
